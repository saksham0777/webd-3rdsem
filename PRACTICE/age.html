<!DOCTYPE html>
<html>

<head>
    <title>Age Checker</title>
</head>

<body>

    <script>
        let age = Number(prompt("Enter Your Age:"));

        if (age >= 18) {
            alert("You are eligible (18 or above).");
        } else {
            alert("You are not eligible (Below 18).");
        }

    </script>

</body>
</html>
